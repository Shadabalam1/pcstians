<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Memory - PCSTians Portal</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Top Navbar -->
    <nav class="navbar">
        <h2>PCSTians Admin Panel</h2>
        <button id="logoutBtn" class="logout-btn">Logout</button>
    </nav>

    <!-- Upload Type Tabs -->
    <div class="upload-tabs">
        <button class="tab-btn active" data-tab="image">📷 Upload Photo</button>
        <button class="tab-btn" data-tab="video">🎥 Add YouTube Video</button>
    </div>

    <!-- Image Upload Form -->
    <div class="upload-container" id="imageUploadSection">
        <h2>Upload Photo Memory</h2>
        <form id="uploadForm">
            <div class="form-group">
                <label for="image">Select Image</label>
                <input type="file" id="image" accept="image/*" required>
                <img id="imagePreview" src="" alt="Preview" style="display:none;">
            </div>

            <div class="form-group">
                <label for="caption">Caption</label>
                <input type="text" id="caption" placeholder="e.g., Freshers Party 2022" required>
            </div>

            <div class="form-group">
                <label for="hashtags">Hashtags (comma separated)</label>
                <input type="text" id="hashtags" placeholder="e.g., #PCSTians, #Batch2026">
            </div>

            <div class="form-group">
                <label for="year">Year</label>
                <select id="year" required>
                    <option value="2022">2022</option>
                    <option value="2023">2023</option>
                    <option value="2024">2024</option>
                    <option value="2025">2025</option>
                    <option value="2026">2026</option>
                </select>
            </div>

            <button type="submit" id="uploadBtn">Upload Photo</button>
        </form>
        <p id="statusMsg" class="status-msg"></p>
    </div>

    <!-- Video Upload Form -->
    <div class="upload-container" id="videoUploadSection" style="display:none;">
        <h2>Add YouTube Video Memory</h2>
        <form id="videoForm">
            <div class="form-group">
                <label for="videoUrl">YouTube Video URL</label>
                <input type="url" id="videoUrl" placeholder="https://www.youtube.com/watch?v=..." required>
                <small>Paste YouTube video link here</small>
            </div>

            <div class="form-group">
                <label for="videoCaption">Caption/Title</label>
                <input type="text" id="videoCaption" placeholder="e.g., Annual Day Performance 2024" required>
            </div>

            <div class="form-group">
                <label for="videoHashtags">Hashtags (comma separated)</label>
                <input type="text" id="videoHashtags" placeholder="e.g., #AnnualDay, #PCSTians">
            </div>

            <div class="form-group">
                <label for="videoYear">Year</label>
                <select id="videoYear" required>
                    <option value="2022">2022</option>
                    <option value="2023">2023</option>
                    <option value="2024">2024</option>
                    <option value="2025">2025</option>
                    <option value="2026">2026</option>
                </select>
            </div>

            <button type="submit" id="videoUploadBtn">Add Video Memory</button>
        </form>
        <p id="videoStatusMsg" class="status-msg"></p>
    </div>

    <script src="js/upload.js"></script>
</body>
</html>
